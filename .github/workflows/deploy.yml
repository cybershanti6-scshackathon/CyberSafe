name: Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Run Tests (on every push & PR)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run basic import check
        run: |
          python -c "from msme_auditor.engine.orchestrator import run_full_audit; print('✅ Core imports OK')"
          python -c "from msme_auditor.api.server import app; print('✅ FastAPI app OK')"

  # ──────────────────────────────────────────────────────────────
  # Job 2: Deploy to Render (only on push to main)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v1.0.0
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Deployment complete
        run: |
          echo "🚀 Deployment triggered!"
          echo "📍 Check your Render dashboard for status"
          echo "🌐 Your app will be live at: https://cybersure.onrender.com"
