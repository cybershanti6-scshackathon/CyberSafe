<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports — CyberSure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..200" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div data-app>

<div class="page">
  <div class="page-head"><div><h1>Reports</h1><p>Assessment reports generated by CyberSure.</p></div></div>
  <div class="card">
    <div class="table-wrap"><table class="table"><thead><tr><th>Report Name</th><th>Assessment</th><th>Date</th><th>Score</th><th>Actions</th></tr></thead>
    <tbody id="reportsTable">
      <tr><td>RPP Security Report</td><td>RPP</td><td>Today</td><td>84/100</td><td><button class="btn btn-secondary btn-sm report-download">Download PDF</button></td></tr>
      <tr><td>NES Assessment Report</td><td>NES</td><td>Today</td><td>79/100</td><td><button class="btn btn-secondary btn-sm report-download">Download PDF</button></td></tr>
      <tr><td>Web Security Report</td><td>Web Security</td><td>Today</td><td>86/100</td><td><button class="btn btn-secondary btn-sm report-download">Download PDF</button></td></tr>
      <tr><td>Device Compliance Audit</td><td>Devices & Vendors</td><td>Today</td><td>84%</td><td><button class="btn btn-secondary btn-sm report-download">Download PDF</button></td></tr>
    </tbody></table></div>
  </div>
</div>

</div>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 document.querySelectorAll(".report-download").forEach(b=>b.addEventListener("click",()=>downloadReport("CyberSure Assessment Report","CyberSure assessment report. This frontend uses demonstration data until connected to the real assessment backend.")));
});
</script>
</body>
</html>
