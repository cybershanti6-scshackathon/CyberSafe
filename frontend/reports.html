<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports — CyberSure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..200" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div data-app>

<div class="page">
  <div class="page-head"><div><h1>Reports</h1><p>Assessment reports generated by CyberSure.</p></div></div>
  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Report Name</th><th>Assessment</th><th>Date</th><th>Score</th><th>Actions</th></tr>
        </thead>
        <tbody id="reportsTable">
          <tr><td colspan="5" class="empty" style="text-align:center;padding:40px">No reports yet. Run an assessment to generate a report.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</div>
<script src="/static/app.js"></script>
<script src="/static/scanner.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tbody = document.getElementById('reportsTable');
  const history = JSON.parse(localStorage.getItem('scan_history') || '[]');

  if (!history.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty" style="text-align:center;padding:40px">No reports yet. Run an assessment to generate a report.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  history.forEach((entry, i) => {
    const tr = document.createElement('tr');
    const score = entry.results?.score || (entry.batch ? Object.values(entry.results || {}).reduce((sum, r) => sum + (r.score || 0), 0) / Math.max(Object.keys(entry.results || {}).length, 1) : '—');
    const scoreDisplay = typeof score === 'number' ? Math.round(score) + '/100' : score;
    const date = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString() : 'Today';
    tr.innerHTML = `
      <td>${entry.name || 'Scan ' + (i + 1)}</td>
      <td>${entry.batch ? 'Batch' : 'Individual'}</td>
      <td>${date}</td>
      <td>${scoreDisplay}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="downloadReport('${(entry.name || 'Report').replace(/'/g, "\\'")}', '${JSON.stringify(entry.results || {}).replace(/'/g, "\\'").slice(0, 500)}')">Download PDF</button></td>
    `;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
